<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Слизевик-поля</title>
    <link rel="stylesheet" href="/src/styles.css">
  </head>
  <body>
    <div id="app">
      <canvas id="view"></canvas>
      <div id="hud"></div>
      <div id="toolbar">
        <button id="tool-attract" title="Притяжение (1)">➕</button>
        <button id="tool-repel" title="Отталкивание (2)">➖</button>
        <button id="tool-wall" title="Стена (3)">⬛</button>
        <button id="tool-erase" title="Ластик (4)">❌</button>
        <button id="btn-pause" title="Пауза (P)">⏸️</button>
        <button id="btn-reset" title="Сброс сцены">🔄</button>
        <button id="btn-reseed" title="Новые семена">🎲</button>
        <label style="display:flex;align-items:center;gap:6px;color:#aab6c3;">
          <span>Темп</span>
          <input id="tempo" type="range" min="0.2" max="3" step="0.1" value="1" />
        </label>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

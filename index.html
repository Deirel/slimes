<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Слизевик-поля</title>
    <style>
      html, body, #app { height:100%; margin:0; background:#0a0e13; color:#d8e6ee; font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji"; }
      #hud { position: fixed; left: 10px; bottom: 10px; font-size: 12px; line-height: 1.35; background: rgba(10,14,19,0.6); padding: 8px 10px; border-radius: 6px; backdrop-filter: blur(4px); }
      #toolbar { position: fixed; right: 10px; bottom: 10px; display: flex; gap: 6px; background: rgba(10,14,19,0.6); padding: 8px; border-radius: 6px; }
      #toolbar button, #toolbar input[type="range"] { cursor: pointer; }
      #toolbar button { background: #15222c; color:#d8e6ee; border:1px solid #243544; border-radius: 6px; padding: 6px 8px; }
      #toolbar button:hover { background:#1a2a35; }
      #toolbar button.active { background:#1e3746; }
      canvas { display:block; width: 100vw; height: 100vh; image-rendering: pixelated; }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="view"></canvas>
      <div id="hud"></div>
      <div id="toolbar">
        <button id="tool-attract" title="1">Притяжение</button>
        <button id="tool-repel" title="2">Отталкивание</button>
        <button id="tool-wall" title="3">Стена</button>
        <button id="tool-erase" title="4">Ластик</button>
        <button id="btn-pause" title="P">Пауза</button>
        <button id="btn-reset">Сброс сцены</button>
        <button id="btn-reseed">Новые семена</button>
        <label style="display:flex;align-items:center;gap:6px;color:#aab6c3;">
          Темп
          <input id="tempo" type="range" min="0.2" max="3" step="0.1" value="1" />
        </label>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

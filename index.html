<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Слизевик-поля</title>
    <style>
      html, body, #app { height:100%; margin:0; background:#0a0e13; color:#d8e6ee; font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji"; }
      
      /* Prevent scrolling on mobile */
      body { overflow: hidden; touch-action: none; }
      
      /* HUD - adaptive positioning */
      #hud { 
        position: fixed; 
        left: 10px; 
        bottom: 10px; 
        font-size: 12px; 
        line-height: 1.35; 
        background: rgba(10,14,19,0.8); 
        padding: 8px 10px; 
        border-radius: 6px; 
        backdrop-filter: blur(4px);
        z-index: 10;
      }
      
      /* Toolbar - desktop/landscape layout */
      #toolbar { 
        position: fixed; 
        right: 10px; 
        bottom: 10px; 
        display: flex; 
        flex-direction: column;
        gap: 8px; 
        background: rgba(10,14,19,0.8); 
        padding: 12px; 
        border-radius: 8px; 
        backdrop-filter: blur(4px);
        z-index: 10;
      }
      
      /* Touch-friendly buttons */
      #toolbar button, #toolbar input[type="range"] { cursor: pointer; }
      #toolbar button { 
        background: #15222c; 
        color:#d8e6ee; 
        border:1px solid #243544; 
        border-radius: 8px; 
        padding: 12px 16px; 
        font-size: 14px;
        min-height: 44px;
        min-width: 44px;
        transition: background-color 0.2s;
      }
      #toolbar button:hover, #toolbar button:active { background:#1a2a35; }
      #toolbar button.active { background:#1e3746; border-color: #4a9eff; }
      
      /* Range slider improvements */
      #toolbar label {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #aab6c3;
        font-size: 12px;
        padding: 4px 0;
      }
      
      #toolbar input[type="range"] {
        width: 120px;
        height: 32px;
        -webkit-appearance: none;
        appearance: none;
        background: #243544;
        border-radius: 4px;
      }
      
      #toolbar input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #4a9eff;
        cursor: pointer;
      }
      
      #toolbar input[type="range"]::-moz-range-thumb {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #4a9eff;
        cursor: pointer;
        border: none;
      }
      
      canvas { display:block; width: 100vw; height: 100vh; image-rendering: pixelated; }
      
      /* Adjust canvas for mobile toolbar */
      @media screen and (max-width: 768px), (max-height: 600px) {
        canvas { height: calc(100vh - 60px); }
      }
      
      /* Mobile/Portrait orientation */
      @media screen and (max-width: 768px), (max-height: 600px) {
        #toolbar {
          position: fixed;
          bottom: 0;
          left: 0;
          right: 0;
          height: 60px;
          display: flex;
          flex-direction: row;
          justify-content: space-evenly;
          align-items: center;
          padding: 8px;
          gap: 4px;
          max-width: none;
          transform: none;
          border-radius: 0;
        }
        
        #toolbar button {
          width: 44px;
          height: 44px;
          padding: 0;
          font-size: 18px;
          flex: 0 0 44px;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        
        #toolbar label {
          flex: 0 0 auto;
          flex-direction: column;
          gap: 2px;
          font-size: 10px;
          margin: 0;
        }
        
        #toolbar label span {
          text-align: center;
        }
        
        #toolbar input[type="range"] {
          width: 60px;
          height: 20px;
        }
        
        #hud {
          left: 10px;
          top: 10px;
          bottom: auto;
          font-size: 11px;
        }
      }
      
      /* Very small screens */
      @media screen and (max-width: 480px) {
        #toolbar {
          padding: 6px;
        }
        
        #toolbar button {
          width: 40px;
          height: 40px;
          font-size: 16px;
          flex: 0 0 40px;
        }
        
        #toolbar input[type="range"] {
          width: 50px;
          height: 18px;
        }
        
        #hud {
          font-size: 10px;
          padding: 6px 8px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="view"></canvas>
      <div id="hud"></div>
      <div id="toolbar">
        <button id="tool-attract" title="Притяжение (1)">➕</button>
        <button id="tool-repel" title="Отталкивание (2)">➖</button>
        <button id="tool-wall" title="Стена (3)">⬛</button>
        <button id="tool-erase" title="Ластик (4)">❌</button>
        <button id="btn-pause" title="Пауза (P)">⏸️</button>
        <button id="btn-reset" title="Сброс сцены">🔄</button>
        <button id="btn-reseed" title="Новые семена">🎲</button>
        <label style="display:flex;align-items:center;gap:6px;color:#aab6c3;">
          <span>Темп</span>
          <input id="tempo" type="range" min="0.2" max="3" step="0.1" value="1" />
        </label>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
